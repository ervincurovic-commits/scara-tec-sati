<!DOCTYPE html>
<html lang="bs" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Evidencija Radnih i Putnih Sati — Pro Sistem</title>
    <script src="/theme-init.js"></script>
    <script type="module" src="/src/main.js"></script>
</head>
<body class="bg-slate-900 text-slate-100">

    <!-- ================= EKRAN ZA PRIJAVU (LOGIN) ================= -->
    <div id="loginScreen" class="hidden min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950">
        <div class="w-full max-w-md bg-slate-800/95 border border-slate-700 rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6">
            <div class="flex items-center justify-end gap-2">
                <div class="flex items-center bg-slate-900 rounded-xl p-1 border border-slate-700" data-i18n-title="ui.language">
                    <button type="button" class="seg-btn" data-action="set-lang" data-lang="bs">BS</button>
                    <button type="button" class="seg-btn" data-action="set-lang" data-lang="sl">SL</button>
                </div>
                <button type="button" data-action="toggle-theme" class="bg-slate-900 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-xl text-xs font-bold border border-slate-700 transition" data-i18n-title="ui.theme">
                    <i class="fa-solid fa-sun theme-icon"></i>
                </button>
            </div>
            <div class="text-center space-y-2">
                <div class="w-14 h-14 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-2xl text-white shadow-lg shadow-indigo-600/30">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </div>
                <h1 class="text-xl font-extrabold text-white tracking-tight" data-i18n="login.title"></h1>
                <p class="text-xs text-slate-400" data-i18n="login.subtitle"></p>
            </div>

            <form id="loginForm" class="space-y-4" autocomplete="on">
                <div>
                    <label for="loginUsername" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5" data-i18n="login.username"></label>
                    <input type="text" id="loginUsername" required autocomplete="username" autocapitalize="none" spellcheck="false" data-i18n-ph="login.usernamePh"
                        class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label for="loginPassword" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5" data-i18n="login.password"></label>
                    <input type="password" id="loginPassword" required autocomplete="current-password" data-i18n-ph="login.passwordPh"
                        class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                </div>
                <div id="loginErrorMsg" class="hidden text-xs font-semibold text-red-400 bg-red-950/60 border border-red-800/70 rounded-xl px-3 py-2"></div>
                <button type="submit" id="loginSubmitBtn" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm rounded-xl shadow-lg transition flex items-center justify-center gap-2 disabled:opacity-60">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span data-i18n="login.submit"></span>
                </button>
            </form>
        </div>
    </div>

    <!-- ================= GLAVNI EKRAN APLIKACIJE ================= -->
    <div id="appScreen" class="hidden min-h-screen pb-12">

        <!-- ZAGLAVLJE -->
        <header class="bg-slate-800 border-b border-slate-700 md:sticky top-0 z-30 shadow-xl">
            <div class="max-w-[98%] mx-auto px-1 sm:px-4 py-3 flex flex-col xl:flex-row xl:items-center xl:justify-between gap-3">
                <div class="flex items-center justify-between gap-3 min-w-0">
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="w-10 h-10 shrink-0 bg-indigo-600 rounded-xl flex items-center justify-center text-lg text-white shadow">
                            <i class="fa-solid fa-clock"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="flex items-center gap-2 min-w-0">
                                <span id="headerRoleBadge" class="inline-block text-xs font-extrabold uppercase tracking-wider leading-snug text-indigo-300 bg-indigo-950/90 border border-indigo-700/70 px-2.5 py-0.5 rounded-lg"></span>
                            </div>
                            <p id="headerSubtitle" class="hidden sm:block text-xs text-slate-400 mt-0.5"></p>
                        </div>
                    </div>
                    <!-- Jezik, tema, odjava (mobitel / tablet) -->
                    <div class="flex xl:hidden items-center gap-1.5 shrink-0">
                    <div class="flex items-center bg-slate-900 rounded-xl p-1 border border-slate-700" data-i18n-title="ui.language">
                        <button type="button" class="seg-btn" data-action="set-lang" data-lang="bs">BS</button>
                        <button type="button" class="seg-btn" data-action="set-lang" data-lang="sl">SL</button>
                    </div>
                    <button type="button" data-action="toggle-theme" class="bg-slate-900 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl text-xs font-bold border border-slate-700 transition" data-i18n-title="ui.theme">
                        <i class="fa-solid fa-sun theme-icon"></i>
                    </button>
                    <button type="button" data-action="logout" class="bg-slate-900 hover:bg-red-950/70 text-slate-300 hover:text-red-300 px-3 py-2 rounded-xl text-xs font-bold border border-slate-700 hover:border-red-800 transition flex items-center gap-1.5" data-i18n-title="header.logout">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span class="hidden sm:inline" data-i18n="header.logout"></span>
                    </button>
                    </div>
                </div>

                <!-- Navigacija i kontrole -->
                <div class="flex flex-wrap items-center gap-2">
                    <nav id="roleNavTabs" class="flex flex-wrap items-center gap-1.5 bg-slate-900/90 p-1 rounded-xl border border-slate-700 w-full sm:w-auto"></nav>

                    <!-- Odabir aktivne baustele za vodju delovišča -->
                    <div id="bauSiteHeaderSelector" class="hidden flex items-center gap-1.5 bg-slate-900 rounded-xl px-2.5 py-1.5 border border-emerald-700/60 max-w-full min-w-0">
                        <i class="fa-solid fa-building text-emerald-400 text-xs"></i>
                        <select id="bauActiveSiteSelect" class="bg-transparent text-xs font-bold text-emerald-300 outline-none cursor-pointer min-w-0 max-w-[16rem] truncate"></select>
                    </div>

                    <!-- KW kontrole -->
                    <div id="kwControlsGroup" class="hidden flex items-center bg-slate-900 rounded-xl p-1 border border-slate-700">
                        <button type="button" data-action="bau-week" data-delta="-1" class="px-3 py-1.5 hover:bg-slate-800 rounded-lg text-slate-300 transition" data-i18n-title="header.prevWeek">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <div class="px-2 sm:px-3 text-center min-w-[110px] sm:min-w-[125px]">
                            <span id="currentKwDisplay" class="font-bold text-xs sm:text-sm text-indigo-400">KW -- (----)</span>
                        </div>
                        <button type="button" data-action="bau-week" data-delta="1" class="px-3 py-1.5 hover:bg-slate-800 rounded-lg text-slate-300 transition" data-i18n-title="header.nextWeek">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>

                    <button type="button" id="todayKwBtn" data-action="bau-week-today" class="hidden bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-xl text-xs font-semibold border border-slate-600 transition" data-i18n="header.thisWeek"></button>

                    <button type="button" id="downloadPdfBtn" data-action="bau-weekly-pdf" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-file-pdf"></i>
                        <span data-i18n="header.downloadPdf"></span>
                    </button>

                    <!-- Jezik, tema, odjava (desktop) -->
                    <div class="hidden xl:flex items-center gap-2">
                    <div class="flex items-center bg-slate-900 rounded-xl p-1 border border-slate-700" data-i18n-title="ui.language">
                        <button type="button" class="seg-btn" data-action="set-lang" data-lang="bs">BS</button>
                        <button type="button" class="seg-btn" data-action="set-lang" data-lang="sl">SL</button>
                    </div>
                    <button type="button" data-action="toggle-theme" class="bg-slate-900 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl text-xs font-bold border border-slate-700 transition" data-i18n-title="ui.theme">
                        <i class="fa-solid fa-sun theme-icon"></i>
                    </button>
                    <button type="button" data-action="logout" class="bg-slate-900 hover:bg-red-950/70 text-slate-300 hover:text-red-300 px-3 py-2 rounded-xl text-xs font-bold border border-slate-700 hover:border-red-800 transition flex items-center gap-1.5" data-i18n-title="header.logout">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span class="hidden sm:inline" data-i18n="header.logout"></span>
                    </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- GLAVNI KONTEJNER -->
        <main class="max-w-[98%] mx-auto px-1 sm:px-4 py-4 sm:py-6 space-y-6">

            <!-- ================= SEKCIJA 1: ADMINISTRATOR ================= -->
            <section id="adminSection" class="hidden space-y-6">

                <!-- Admin Tab 1: Baustelle -->
                <div id="adminTabBaustelle" class="hidden space-y-6">
                    <div id="adminSitesOverview" class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg lg:col-span-2">
                            <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                                <i class="fa-solid fa-helmet-safety"></i> <span data-i18n="admin.site.createTitle"></span>
                            </h2>
                            <form id="adminAddSiteForm" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2.5">
                                <input type="text" id="newSiteName" required maxlength="200" data-i18n-ph="admin.site.namePh"
                                    class="md:col-span-2 px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                                <input type="text" id="newSiteCompany" required maxlength="200" data-i18n-ph="admin.site.companyPh"
                                    class="md:col-span-2 px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                                <select id="newSiteBaulajter" required class="md:col-span-2 px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-emerald-500"></select>
                                <input type="text" id="newSiteDefaultProject" maxlength="200" data-i18n-ph="admin.site.projectPh"
                                    class="px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                                <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5">
                                    <i class="fa-solid fa-plus"></i> <span data-i18n="admin.site.createBtn"></span>
                                </button>
                            </form>
                        </div>

                        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg flex items-center justify-between">
                            <div>
                                <p class="text-xs font-bold uppercase tracking-wider text-slate-400" data-i18n="admin.site.activeCount"></p>
                                <p id="adminTotalSitesCount" class="text-3xl font-black text-emerald-400 mt-1">0</p>
                                <p class="text-xs text-slate-400 mt-1" data-i18n="admin.site.activeHint"></p>
                            </div>
                            <div class="w-12 h-12 bg-emerald-950/80 text-emerald-400 border border-emerald-800/60 rounded-xl flex items-center justify-center text-xl">
                                <i class="fa-solid fa-building"></i>
                            </div>
                        </div>
                    </div>

                    <div id="adminSitesGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
                    <div id="adminSelectedSitePanel" class="hidden bg-slate-800 p-5 rounded-xl border border-indigo-700/70 shadow-xl space-y-5"></div>
                </div>

                <!-- Admin Tab 2: Baza podataka & Mjesečni pregled -->
                <div id="adminTabDatabase" class="hidden space-y-6">
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg lg:col-span-2">
                            <h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                                <i class="fa-solid fa-user-plus"></i> <span data-i18n="admin.db.addTitle"></span>
                            </h2>
                            <form id="adminAddUserForm" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5" autocomplete="off">
                                <input type="text" id="newUserName" required maxlength="120" data-i18n-ph="admin.db.namePh"
                                    class="px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                                <input type="text" id="newUserUsername" required maxlength="40" autocapitalize="none" spellcheck="false" autocomplete="off" data-i18n-ph="admin.db.usernamePh"
                                    class="px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                                <input type="text" id="newUserPassword" required minlength="6" maxlength="72" autocomplete="off" data-i18n-ph="admin.db.passwordPh"
                                    class="px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                                <input type="email" id="newUserEmail" maxlength="200" data-i18n-ph="admin.db.emailPh"
                                    class="px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                                <input type="text" id="newUserPhone" maxlength="60" data-i18n-ph="admin.db.phonePh"
                                    class="px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                                <div class="flex gap-2">
                                    <select id="newUserRole" class="flex-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
                                        <option value="radnik" data-i18n="role.radnik"></option>
                                        <option value="baulajter" data-i18n="role.baulajter"></option>
                                        <option value="admin" data-i18n="role.admin"></option>
                                    </select>
                                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition shrink-0" data-i18n="common.add"></button>
                                </div>
                            </form>
                        </div>

                        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg flex flex-col justify-between gap-3">
                            <div>
                                <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-1 flex items-center gap-2">
                                    <i class="fa-solid fa-database"></i> <span data-i18n="admin.backup.title"></span>
                                </h2>
                                <p class="text-xs text-slate-400" data-i18n="admin.backup.hint"></p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button type="button" data-action="backup-export" class="flex-1 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-xs font-bold border border-slate-600 transition">
                                    <i class="fa-solid fa-download mr-1"></i> <span data-i18n="admin.backup.save"></span>
                                </button>
                                <label class="flex-1 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-xs font-bold border border-slate-600 transition text-center cursor-pointer">
                                    <i class="fa-solid fa-upload mr-1"></i> <span data-i18n="admin.backup.load"></span>
                                    <input type="file" id="importBackupInput" accept=".json,application/json" class="hidden">
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="bg-slate-800 rounded-xl border border-slate-700 shadow-lg overflow-hidden">
                        <div class="p-4 border-b border-slate-700 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300" data-i18n="admin.db.tableTitle"></h3>
                            <span id="adminDbCountBadge" class="text-xs font-semibold text-indigo-400"></span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse min-w-[920px] text-xs">
                                <thead>
                                    <tr class="bg-slate-900/90 text-slate-400 uppercase border-b border-slate-700">
                                        <th class="p-3" data-i18n="admin.db.colName"></th>
                                        <th class="p-3" data-i18n="admin.db.colRole"></th>
                                        <th class="p-3" data-i18n="admin.db.colLogin"></th>
                                        <th class="p-3" data-i18n="admin.db.colPassword"></th>
                                        <th class="p-3" data-i18n="admin.db.colPhone"></th>
                                        <th class="p-3" data-i18n="admin.db.colEmail"></th>
                                        <th class="p-3 text-right" data-i18n="admin.db.colActions"></th>
                                    </tr>
                                </thead>
                                <tbody id="adminUsersTableBody" class="divide-y divide-slate-700/70"></tbody>
                            </table>
                        </div>
                    </div>

                    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg space-y-4">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
                            <div>
                                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                                    <i class="fa-solid fa-magnifying-glass text-indigo-400"></i> <span data-i18n="admin.month.title"></span>
                                </h3>
                                <p class="text-xs text-slate-400" data-i18n="admin.month.hint"></p>
                            </div>
                            <div class="flex flex-wrap items-center gap-2">
                                <input type="text" id="adminSearchPersonInput" data-i18n-ph="admin.month.searchPh"
                                    class="px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                                <input type="month" id="adminMonthPicker"
                                    class="px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
                            </div>
                        </div>
                        <div id="adminMonthlySearchResult" class="space-y-4"></div>
                    </div>
                </div>
            </section>

            <!-- ================= SEKCIJA 2: VODJA DELOVIŠČA ================= -->
            <section id="baulajterSection" class="hidden space-y-6">
                <div id="bauTabWeekly" class="space-y-6">
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4">
                        <div class="col-span-2 md:col-span-1 bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col justify-between gap-3 shadow-md">
                            <div>
                                <h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                                    <i class="fa-solid fa-user-plus"></i> <span data-i18n="bau.addFromGroup"></span>
                                </h2>
                                <div class="flex gap-2">
                                    <select id="bauAddPersonSelect" class="project-select"></select>
                                    <button type="button" data-action="bau-add-person" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shrink-0" data-i18n="common.add"></button>
                                </div>
                            </div>
                            <div class="pt-2 border-t border-slate-700/60">
                                <input type="text" id="bauSearchListInput" data-i18n-ph="bau.filterPh"
                                    class="w-full px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-200 focus:outline-none focus:border-indigo-500 placeholder-slate-500">
                            </div>
                        </div>

                        <div class="col-span-2 md:col-span-1 bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col justify-between gap-2 shadow-md">
                            <div>
                                <span class="text-xs font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-1.5 mb-2">
                                    <i class="fa-solid fa-folder-plus"></i> <span data-i18n="bau.projectList"></span>
                                </span>
                                <form id="bauAddProjectForm" class="flex gap-2">
                                    <input type="text" id="bauNewProjectInput" required maxlength="200" data-i18n-ph="bau.newProjectPh"
                                        class="flex-1 px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shrink-0" data-i18n="common.add"></button>
                                </form>
                            </div>
                            <div id="bauProjectsListContainer" class="flex flex-wrap gap-1.5 max-h-20 overflow-y-auto pt-2 border-t border-slate-700/60"></div>
                        </div>

                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex items-center justify-between shadow-md">
                            <div>
                                <p class="text-xs uppercase tracking-wider font-bold text-slate-400" data-i18n="bau.onList"></p>
                                <p id="bauActiveListCount" class="text-2xl font-black text-white mt-1">0</p>
                                <p id="bauCurrentSiteLabel" class="text-xs text-emerald-400 mt-1 truncate max-w-[160px]">Baustelle</p>
                            </div>
                            <div class="hidden sm:flex w-12 h-12 bg-indigo-950/80 text-indigo-400 border border-indigo-800/60 rounded-xl items-center justify-center text-xl">
                                <i class="fa-solid fa-users"></i>
                            </div>
                        </div>

                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex items-center justify-between shadow-md">
                            <div>
                                <p class="text-xs uppercase tracking-wider font-bold text-slate-400" data-i18n="bau.totalWeek"></p>
                                <p id="bauTotalWeeklyHours" class="text-2xl font-black text-indigo-400 mt-1">0 h</p>
                                <p id="bauTotalWeeklyBreakdown" class="text-xs text-slate-400 mt-1"></p>
                            </div>
                            <div class="hidden sm:flex w-12 h-12 bg-emerald-950/80 text-emerald-400 border border-emerald-800/60 rounded-xl items-center justify-center text-xl">
                                <i class="fa-solid fa-calculator"></i>
                            </div>
                        </div>
                    </div>

                    <div id="pdfContent" class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-xl">
                        <div class="pdf-header p-6 bg-slate-950 text-white border-b border-slate-800">
                            <div class="flex justify-between items-center">
                                <div>
                                    <h1 class="text-2xl font-bold" data-i18n="bau.pdf.title"></h1>
                                    <p class="text-sm text-slate-400 mt-1" id="pdfKwTitle"></p>
                                </div>
                                <div class="text-right">
                                    <p class="text-xs text-slate-400" data-i18n="bau.pdf.generated"></p>
                                    <p class="text-sm font-semibold" id="pdfReportDate">--.--.----</p>
                                </div>
                            </div>
                        </div>

                        <div id="bauMobileList" class="md:hidden divide-y divide-slate-700/80"></div>
                        <div class="bau-table-wrap hidden md:block overflow-x-auto">
                            <table class="w-full text-left border-collapse min-w-[1150px]">
                                <thead>
                                    <tr class="bg-slate-900/90 text-slate-400 text-xs font-bold uppercase tracking-wider border-b border-slate-700">
                                        <th class="p-3 text-center w-10">#</th>
                                        <th class="p-3 w-48" data-i18n="bau.colPerson"></th>
                                        <th class="p-3 text-center" data-i18n="day.mon"></th>
                                        <th class="p-3 text-center" data-i18n="day.tue"></th>
                                        <th class="p-3 text-center" data-i18n="day.wed"></th>
                                        <th class="p-3 text-center" data-i18n="day.thu"></th>
                                        <th class="p-3 text-center" data-i18n="day.fri"></th>
                                        <th class="p-3 text-center" data-i18n="day.sat"></th>
                                        <th class="p-3 text-center" data-i18n="day.sun"></th>
                                        <th class="p-3 text-center w-36" data-i18n="bau.colTotal"></th>
                                        <th class="p-3 text-center w-14 no-pdf" data-i18n="bau.colAction"></th>
                                    </tr>
                                </thead>
                                <tbody id="bauTableBody" class="divide-y divide-slate-700/80 text-sm"></tbody>
                            </table>
                        </div>

                        <div id="bauEmptyMessage" class="hidden p-10 text-center text-slate-400 text-xs" data-i18n="bau.empty"></div>

                        <div class="pdf-header p-4 bg-slate-950 border-t border-slate-800 text-xs text-slate-400 flex justify-between">
                            <span data-i18n="header.subtitleDefault"></span>
                            <span id="pdfTotalFooter"></span>
                        </div>
                    </div>
                </div>

                <div id="bauTabMyHours" class="hidden space-y-4">
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                            <h2 class="text-sm font-bold text-white" data-i18n="bau.my.title"></h2>
                            <p class="text-xs text-slate-400" data-i18n="bau.my.hint"></p>
                        </div>
                        <input type="month" id="bauMyMonthPicker" class="px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
                    </div>
                    <div id="bauMyMonthlyContent"></div>
                </div>

                <div id="bauTabProjects" class="hidden space-y-6"></div>

                <div id="bauTabNotes" class="hidden space-y-4">
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                            <h2 class="text-sm font-bold text-white" data-i18n="notes.title"></h2>
                            <p class="text-xs text-slate-400" data-i18n="notes.hint"></p>
                        </div>
                        <select id="bauNotesSiteSelect" data-change="bau-notes-site" class="project-select sm:max-w-xs"></select>
                    </div>
                    <div id="bauNotesContent" class="bg-slate-800 p-4 rounded-xl border border-slate-700"></div>
                </div>
            </section>

            <!-- ================= SEKCIJA 3: RADNIK ================= -->
            <section id="radnikSection" class="hidden space-y-4">
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                        <h2 class="text-sm font-bold text-white" data-i18n="radnik.title"></h2>
                        <p class="text-xs text-slate-400" data-i18n="radnik.hint"></p>
                    </div>
                    <input type="month" id="radnikMonthPicker" class="px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
                </div>
                <div id="radnikMonthlyContent"></div>
            </section>

            <!-- ================= SEKCIJA 4: IMENIK ZAPOSLENIH ================= -->
            <section id="directorySection" class="hidden space-y-4">
                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg space-y-4">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                            <h2 class="text-base font-bold text-white flex items-center gap-2">
                                <i class="fa-solid fa-address-book text-indigo-400"></i> <span data-i18n="dir.title"></span>
                            </h2>
                            <p class="text-xs text-slate-400" data-i18n="dir.hint"></p>
                        </div>
                        <input type="text" id="directorySearchInput" data-i18n-ph="dir.searchPh"
                            class="px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div id="directoryCardsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
                </div>
            </section>

        </main>
    </div>

    <!-- ================= MODAL ZA IZMJENU LOGIN PODATAKA (ADMIN) ================= -->
    <div id="editCredentialsModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-800 rounded-2xl border border-slate-700 max-w-md w-full p-6 space-y-4 shadow-2xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-950 text-indigo-400 border border-indigo-700 rounded-xl flex items-center justify-center">
                    <i class="fa-solid fa-key"></i>
                </div>
                <div>
                    <h3 class="text-base font-bold text-white" data-i18n="cred.title"></h3>
                    <p id="editCredUserDisplay" class="text-xs text-slate-400"></p>
                </div>
            </div>
            <form id="editCredentialsForm" class="space-y-3" autocomplete="off">
                <input type="hidden" id="editCredUserId">
                <div>
                    <label for="editCredUsername" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1" data-i18n="cred.username"></label>
                    <input type="text" id="editCredUsername" required maxlength="40" autocapitalize="none" spellcheck="false" autocomplete="off"
                        class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label for="editCredPassword" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1" data-i18n="cred.password"></label>
                    <input type="text" id="editCredPassword" minlength="6" maxlength="72" autocomplete="off" data-i18n-ph="cred.passwordPh"
                        class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-1">
                    <div>
                        <label for="editCredPhone" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1" data-i18n="cred.phone"></label>
                        <input type="text" id="editCredPhone" maxlength="60"
                            class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label for="editCredEmail" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1" data-i18n="cred.email"></label>
                        <input type="email" id="editCredEmail" maxlength="200"
                            class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="flex justify-end gap-2 pt-3 border-t border-slate-700">
                    <button type="button" data-action="cred-close" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs text-slate-200 font-semibold" data-i18n="common.cancel"></button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold" data-i18n="cred.save"></button>
                </div>
            </form>
        </div>
    </div>

    <!-- ================= MODAL ZA POTVRDU ================= -->
    <div id="confirmModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-800 rounded-2xl border border-slate-700 max-w-md w-full p-6 space-y-4 shadow-2xl">
            <h3 id="confirmModalTitle" class="text-base font-bold text-white"></h3>
            <p id="confirmModalText" class="text-xs text-slate-300 leading-relaxed"></p>
            <div class="flex justify-end gap-2 pt-2">
                <button type="button" id="confirmModalCancelBtn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs text-slate-200 font-semibold" data-i18n="common.cancel"></button>
                <button type="button" id="confirmModalOkBtn" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-bold" data-i18n="common.confirm"></button>
            </div>
        </div>
    </div>

    <!-- ================= MODAL ZA ELEKTRONSKI POTPIS ================= -->
    <div id="signatureModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-800 rounded-2xl border border-slate-700 max-w-2xl w-full p-6 space-y-4 shadow-2xl max-h-[92vh] overflow-y-auto">
            <div>
                <h3 id="signatureModalTitle" class="text-base font-bold text-white"></h3>
                <p id="signatureModalSubtitle" class="text-xs text-slate-400 mt-1"></p>
            </div>

            <div id="signatureContextBox" class="hidden bg-slate-900/95 border border-slate-700 rounded-xl p-4 space-y-3 text-xs">
                <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-2">
                    <span id="sigLangBadge" class="px-2.5 py-0.5 rounded-lg font-bold bg-indigo-950 text-indigo-300 border border-indigo-700">DE</span>
                    <button type="button" data-action="sig-switch-lang" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-[12px] font-bold border border-slate-600">
                        DE / SL
                    </button>
                </div>
                <div id="sigCompanyMetaGrid" class="grid grid-cols-1 sm:grid-cols-3 gap-2.5"></div>
                <div id="sigHoursPreviewContainer" class="overflow-x-auto max-h-52 border border-slate-800 rounded-lg"></div>
            </div>

            <div class="rounded-xl overflow-hidden border-2 border-indigo-500" style="background:#ffffff">
                <canvas id="signatureCanvas" class="w-full h-44 block touch-none cursor-crosshair"></canvas>
            </div>
            <div class="flex items-center justify-between gap-2 pt-1">
                <button type="button" data-action="sig-clear" id="sigClearBtn" class="px-3.5 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl text-xs font-semibold"></button>
                <div class="flex gap-2">
                    <button type="button" data-action="sig-close" id="sigCancelBtn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl text-xs font-semibold"></button>
                    <button type="button" data-action="sig-save" id="sigSaveBtn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold"></button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL ZA ODABIR JEZIKA POTPISA BAULAITER AG -->
    <div id="kundeLangModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-800 rounded-2xl border border-slate-700 max-w-md w-full p-6 space-y-4 shadow-2xl">
            <div>
                <h3 class="text-base font-bold text-white" data-i18n="kunde.langTitle"></h3>
                <p class="text-xs text-slate-400 mt-1" data-i18n="kunde.langHint"></p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                <button type="button" data-action="kunde-lang" data-lang="de" class="p-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2 shadow transition">
                    <i class="fa-solid fa-language"></i>
                    <span data-i18n="kunde.langDe"></span>
                </button>
                <button type="button" data-action="kunde-lang" data-lang="sl" class="p-3.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2 shadow transition">
                    <i class="fa-solid fa-language"></i>
                    <span data-i18n="kunde.langSl"></span>
                </button>
            </div>
            <div class="flex justify-end pt-2 border-t border-slate-700">
                <button type="button" data-action="kunde-lang-close" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs text-slate-200 font-semibold" data-i18n="common.cancel"></button>
            </div>
        </div>
    </div>

    <!-- OBAVJEŠTENJE (TOAST) -->
    <div id="toastMessage" role="status" class="fixed bottom-5 right-5 z-50 hidden bg-slate-800 text-white border border-indigo-500/70 px-4 py-3 rounded-xl shadow-2xl text-xs font-semibold"></div>

    <!-- KONTEJNER ZA STUNDENNACHWEIS PDF FORMAT (SCARA-Tec) -->
    <div id="scaraPdfExportRoot" style="position: fixed; left: 0; top: 0; width: 760px; background: #ffffff; color: #000000; z-index: -50; opacity: 0; pointer-events: none;"></div>
</body>
</html>
